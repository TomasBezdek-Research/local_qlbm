[project]
name = "local-qlbm"
version = "0.1.0"
description = "A specialized Local Quantum Lattice Boltzmann (QLBM) solver for the Pure Advection Equation, implemented using the Qrisp framework."
readme = "README.md"
requires-python = ">=3.11, <=3.13"
authors = [
    { name = "Tomas Bezdek", email = "tomas.bezdek@tum.de" },
    { name = "Tobias Koeppl", email = "" },
]

dependencies = [
    "pyevtk>=1.6.0",
    "qrisp>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_measurement", "src/qlbm"]
